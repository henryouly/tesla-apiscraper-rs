name: Release
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --locked

  release-binary:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
          target: x86_64-unknown-linux-musl
      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build x86_64 musl binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Package binary
        run: |
          cp target/x86_64-unknown-linux-musl/release/tesla-apiscraper-rs tesla-apiscraper-rs-x86_64-unknown-linux-musl
          sha256sum tesla-apiscraper-rs-x86_64-unknown-linux-musl > tesla-apiscraper-rs-x86_64-unknown-linux-musl.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            tesla-apiscraper-rs-x86_64-unknown-linux-musl
            tesla-apiscraper-rs-x86_64-unknown-linux-musl.sha256

  release:
    needs: [test, release-binary]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
