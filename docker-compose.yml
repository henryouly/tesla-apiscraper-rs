services:
  tesla-apiscraper-rs:
    build: .
    container_name: tesla-apiscraper-rs
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_USERNAME: ${INFLUXDB_USERNAME:-}
      INFLUXDB_PASSWORD: ${INFLUXDB_PASSWORD:-}
      INFLUXDB_DATABASE: tesla
    volumes:
      - sqlite-data:/data
    depends_on:
      influxdb:
        condition: service_healthy

  influxdb:
    image: influxdb:1.8
    container_name: tesla-apiscraper-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      INFLUXDB_DB: tesla
      # Enable auth by uncommenting and setting a user (auto-created on first boot):
      # INFLUXDB_USER: teslamate
      # INFLUXDB_USER_PASSWORD: change-me
      # INFLUXDB_HTTP_AUTH_ENABLED: "true"
    volumes:
      - influxdb-data:/var/lib/influxdb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  grafana:
    image: grafana/grafana:latest
    container_name: tesla-apiscraper-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  sqlite-data:
  influxdb-data:
  grafana-data:
