# Eclipse Mosquitto 2.x configuration for Docker Compose deployment.
# By default Mosquitto 2 only listens on localhost inside the container;
# an explicit listener is required for sibling containers (tesla-apiscraper-rs)
# to connect over the Compose network.

listener 1883
persistence true
persistence_location /mosquitto/data/

# Anonymous access is safe only while port 1883 stays bound to 127.0.0.1 / internal
# Docker network. For authenticated MQTT, set `allow_anonymous false` and mount a
# password file created with `mosquitto_passwd`.
allow_anonymous true
# password_file /mosquitto/config/passwd
